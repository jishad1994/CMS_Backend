services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    image: jishadkolapurath/contentra-backend:local
    # image: jishadkolapurath/contentra-backend:dev
    ports:
      # - "3000:3000"
      - "127.0.0.1:3000:3000" 
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: